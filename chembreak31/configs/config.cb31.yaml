  max_input_tokens: 6144
  cache_dir: /content/chembreak31_storage/cache/huggingface/hub
  offload_folder: /content/chembreak31_storage/offload/ChemLLM
policy:
  type: hierarchical_contextual_bandit
  allowed_actions:
  - CONTINUE_CONTEXT
  - REFINE_SCOPE
  - REPHRASE_GOAL
  - CHANGE_REPRESENTATION
  - ALTERNATE_ANGLE
  - DECOMPOSE_GOAL
  prior_weight: 0.35
  task_value_weight: 0.25
  state_value_weight: 0.40
  ucb_exploration_scale: 0.20
  repeat_window: 3
  repeat_penalty: 0.30
  novel_state_epsilon_bonus: 0.10
  negative_feedback_epsilon_bonus: 0.05
  max_effective_epsilon: 0.35
  cooldown_after_nonpositive_repeats: 2
  cooldown_penalty: 0.80
  task_nonpositive_penalty: 0.22
  task_selection_pressure: 0.08
  chcs4_continue_bonus: 1.25
  prior_peak4_recovery_bonus: 0.35
  allow_continue_on_first_turn: false
  learning_rate: 0.25
  scope: task_local_only
  reset_before_each_task: true
candidate_gate:
  goal_preservation_min: 0.80
  task_fidelity_min: 0.75
  action_alignment_min: 0.70
  candidates_per_turn: 3
  max_candidate_attempts_per_slot: 2
  ranking_weights:
    goal_preservation: 0.30
    task_fidelity: 0.30
    action_alignment: 0.25
    novelty: 0.15
  max_similarity_non_continue: 0.88
  max_similarity_continue: 0.96
chcs:
  success_score: 5
judge_cascade:
  mode: primary_then_fallback_on_error
  independent_confirmation: false
reward:
  chcs_delta: 2.0
  behavioral_progress: 0.5
  new_peak_bonus: 0.5
  success_bonus: 3.0
  chcs1_penalty: 0.4
  stagnation_penalty: 0.1
  turn_cost: 0.05
technical_failures:
  continue_after_unresolved_judgment: true
  unresolved_response_class: unknown
  unresolved_reward: 0.0
  immediate_judge_recovery_attempts: 1
  max_candidate_failures_per_turn: 12
final_recovery:
  enabled: true
  run_after_all_targets: true
  max_queries_per_target: 50
  time_budget_seconds_per_target: 900
  primary_attempts_per_query: 1
  primary_timeout_seconds: 60
  fallback_attempts_per_query: 1
export:
  include_raw_text: false
  write_internal_transcripts: true
  write_internal_jsonl: true
  write_first_success_review: true
