[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"
[project]
name="chembreak15"
version="15.0.0"
description="ChemBreak 15 mini-dataset adaptive MDP safety-evaluation harness"
requires-python=">=3.10"
dependencies=["pandas>=2.2,<3","PyYAML>=6,<7"]
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
