[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="chembreak18"
version="18.0.1"
description="ChemBreak 18 hierarchical adaptive MDP safety-evaluation harness with persistent evidence memory"
requires-python=">=3.10"
dependencies=["pandas>=2.2,<3","PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where=["src"]

[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
