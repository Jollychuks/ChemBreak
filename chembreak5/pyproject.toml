[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chembreak5"
version = "5.0.0"
description = "Controlled adaptive multi-turn safety evaluation for chemistry language models"
requires-python = ">=3.10"
dependencies = [
  "accelerate==0.30.1",
  "google-auth>=2.35,<3",
  "google-cloud-storage>=2.18,<4",
  "google-genai>=1.47,<2",
  "openai>=1.57,<3",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "peft==0.10.0",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "rdkit>=2024.3",
  "scipy>=1.13,<2",
  "sentencepiece==0.2.0",
  "tenacity>=9,<10",
  "transformers==4.40.2",
  "tokenizers==0.19.1",
  "huggingface-hub==0.23.5",
  "safetensors==0.4.5",
  "einops==0.8.1",
]

[project.scripts]
chembreak5 = "chembreak5.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
