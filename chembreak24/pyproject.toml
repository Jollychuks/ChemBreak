[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="chembreak24"
version="24.0.0"
description="ChemBreak24 CHCS-based replay-augmented adaptive MDP safety-evaluation harness"
requires-python=">=3.10"
dependencies=["pandas>=2.2,<3","PyYAML>=6,<7","google-genai>=1.47,<2"]

[tool.setuptools.packages.find]
where=["src"]

[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
