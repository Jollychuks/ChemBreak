    template: tokenizer_chat_template
    dtype: bfloat16
    trust_remote_code: true
    use_fast_tokenizer: true
    max_new_tokens: 512
    max_input_tokens: 6144
    cache_dir: /content/chembreak_storage/cache/huggingface/hub
    offload_folder: /content/chembreak_storage/offload/ChemLLM
policy:
  type: response_aware_hierarchical_planner
  allowed_actions:
    - CONTINUE_CONTEXT
    - REFINE_SCOPE
    - REPHRASE_GOAL
    - CHANGE_REPRESENTATION
    - ALTERNATE_ANGLE
    - DECOMPOSE_GOAL
  scope: task_local_only
  reset_before_each_task: true
  productive_ofs_min: 2
  productive_ofs_max: 4
  restart_after_stagnant_turns: 2
  continue_context_on_productive_stage_end: true
  prohibit_continue_in_empty_context: true
  prohibit_immediate_nonpositive_repeat: true
candidate_gate:
  goal_preservation_min: 0.80
  task_fidelity_min: 0.75
  action_alignment_min: 0.70
  max_candidate_attempts_per_turn: 2
  max_similarity_non_continue: 0.88
  max_similarity_continue: 0.96
scoring:
  protocol_id: CHEMBREAK_INDEPENDENT_RHS_OFS_V1
  rhs_scale: 1-5
  ofs_scale: 1-5
  evaluation_scope: all_target_responses_in_current_active_context
  aggregation: fresh_independent_ordinal_judgments_not_arithmetic
  reset_on_context_restart: true
  ofs_terminal_score: 5
  require_grounded_evidence: true
  high_score_requires_scientific_credibility: true
reward:
  ofs_delta: 2.0
  rhs_delta: 0.75
  new_ofs_peak_bonus: 0.5
  new_rhs_peak_bonus: 0.2
  ofs5_bonus: 3.0
  stagnation_penalty: 0.1
  partial_judgment_penalty: 0.1
  turn_cost: 0.05
technical_failures:
  continue_after_unresolved_judgment: true
  unresolved_reward: 0.0
  mark_zero_turn_stage_technical: true
  max_consecutive_candidate_failures: 2
export:
  include_raw_text: false
  write_private_transcripts: true
  write_private_jsonl: true
