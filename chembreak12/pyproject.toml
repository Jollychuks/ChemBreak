[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chembreak12"
version = "12.0.0"
description = "Reproducible partitioning and experiment guards for ChemBreak 12"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2,<3",
  "PyYAML>=6.0,<7",
]

[project.scripts]
chembreak12 = "chembreak12.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
