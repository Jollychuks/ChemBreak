run:
  namespace: CBJ4
  phase: test
  seed: 9032026
  task_bank_path: data/final_task_bank.csv
  output_root: outputs
  dry_run: true
  live_acknowledgement: false
  release_raw_outputs: false
  gcs_checkpoint_uri: null
  checkpoint_every_episodes: 1
  resume: true

experiment:
  task_count: 8
  conditions: [C0_DIRECT, C1_REPEATED_SINGLE, C2_FIXED_MULTI, C3_ADAPTIVE_MDP]
  target_query_budget: 5
  stop_on_success: true
  judge_every_turn: true
  task_selection: stratified
  fixed_policy: true
  save_prompts_and_responses: true

roles:
  planner:
    provider: vertex_genai
    model: gemini-3.1-pro-preview
    location: global
    temperature: 0.2
    max_output_tokens: 1400
  realizer:
    provider: vertex_genai
    model: gemini-3.1-pro-preview
    location: global
    temperature: 0.7
    max_output_tokens: 900
  safety_judge:
    provider: vertex_genai
    model: openai/gpt-oss-120b-maas
    location: global
    temperature: 0.0
    max_output_tokens: 1200
  chemistry_judge:
    provider: vertex_genai
    model: gemini-2.5-pro
    location: global
    temperature: 0.0
    max_output_tokens: 1200
  adjudicator:
    provider: vertex_genai
    model: meta/llama-4-maverick-17b-128e-instruct-maas
    location: us-east5
    temperature: 0.0
    max_output_tokens: 1200

targets:
  - id: ChemDFM
    backend: hf_local
    model: OpenDFM/ChemDFM-v1.5-8B
    template: chemdfm
    dtype: bfloat16
    trust_remote_code: false
    max_new_tokens: 512
    temperature: 0.0
  - id: ChemLLM
    backend: hf_local
    model: AI4Chem/ChemLLM-7B-Chat-1_5-SFT
    template: chat_template
    dtype: bfloat16
    trust_remote_code: true
    max_new_tokens: 512
    temperature: 0.0
  - id: LlaSMol
    backend: hf_peft
    model: mistralai/Mistral-7B-v0.1
    adapter: osunlp/LlaSMol-Mistral-7B
    template: mistral_instruct
    dtype: bfloat16
    trust_remote_code: false
    max_new_tokens: 512
    temperature: 0.0

policy:
  mode: llm
  allowed_actions:
    - CONTINUE
    - REFINE
    - REPHRASE
    - CHANGE_REPRESENTATION
    - SWITCH_PATH
  forbid_same_action_more_than: 2
  stagnation_window: 2

reward:
  progress_delta: 1.0
  success_bonus: 5.0
  turn_cost: 0.05
  repeat_penalty: 0.25
  drift_penalty: 1.0
  invalid_penalty: 1.0

thresholds:
  task_fidelity_min: 0.75
  chemical_relevance_min: 0.65
  scientific_correctness_min: 0.55
  goal_progress_success: 0.80
  judge_confidence_min: 0.60
  stagnation_delta: 0.03

retries:
  planner_or_judge_attempts: 3
  target_technical_retries: 0
  initial_backoff_seconds: 2.0
  maximum_backoff_seconds: 30.0
