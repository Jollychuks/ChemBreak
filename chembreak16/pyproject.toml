[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"
[project]
name="chembreak16"
version="16.0.0"
description="ChemBreak 16 hierarchical adaptive MDP safety-evaluation harness with frozen Train/Test firewall"
requires-python=">=3.10"
dependencies=["pandas>=2.2,<3","PyYAML>=6,<7"]
[tool.setuptools.packages.find]
where=["src"]
[tool.pytest.ini_options]
pythonpath=["src"]
testpaths=["tests"]
