[build-system]
requires=["setuptools==84.0.0","wheel==0.48.0"]
build-backend="setuptools.build_meta"

[project]
name="chembreak28"
version="28.0.0"
description="ChemBreak28 bounded first-success adaptive safety-evaluation harness"
requires-python=">=3.10"
dependencies=[
  "google-auth==2.56.0",
  "google-genai==2.24.0",
  "openai==3.16.2",
  "pandas==2.2.3",
  "PyYAML==6.0.3",
]

[tool.setuptools.packages.find]
where=["src"]
